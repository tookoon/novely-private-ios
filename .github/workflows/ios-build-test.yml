name: Build IPA & iOS 26 Simulator Visual Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode & Inspect Simulators
        run: |
          echo "=== Available Xcodes ==="
          ls -d /Applications/Xcode*.app || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available | head -n 40

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Unsigned Device IPA (for Sideloading)
        run: |
          set -o pipefail
          xcodebuild \
            -project NovelyPrivate.xcodeproj \
            -scheme NovelyPrivate \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build | tail -n 120

          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Novely.app build/ipa/Payload/
          cd build/ipa
          zip -r -q ../NovelyPrivate.ipa Payload
          ls -lh ../NovelyPrivate.ipa

      - name: Run iOS 26 Simulator UI Tests, Capture Screenshots & Record Demo Videos
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          candidates = []
          for rt, devs in data.items():
              if 'iOS' not in rt: continue
              for d in devs:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      score = 0
                      if '26' in rt: score += 100
                      if 'Pro' in d['name'] and 'Max' not in d['name']: score += 20
                      elif '17' in d['name'] or '16' in d['name']: score += 10
                      candidates.append((score, rt, d['name'], d['udid']))
          candidates.sort(reverse=True)
          if not candidates:
              sys.exit(1)
          print(candidates[0][3])
          ")
          echo "Selected Simulator UDID: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl status_bar "$SIM_ID" override --time "09:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

          xcodebuild build-for-testing \
            -project NovelyPrivate.xcodeproj \
            -scheme NovelyPrivate \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build/sim \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            | tail -n 80

          mkdir -p build/videos build/screenshots

          record_clip() {
            local TEST_NAME="$1"
            local OUT_MP4="$2"
            local RESULT_BUNDLE="build/TestResults_${TEST_NAME}.xcresult"
            echo "=== Recording $OUT_MP4 ($TEST_NAME) ==="
            xcrun simctl io "$SIM_ID" recordVideo --codec=h264 --force "build/videos/$OUT_MP4" &
            local REC_PID=$!
            sleep 1
            local TEST_EXIT=0
            xcodebuild test-without-building \
              -project NovelyPrivate.xcodeproj \
              -scheme NovelyPrivate \
              -destination "platform=iOS Simulator,id=$SIM_ID" \
              -derivedDataPath build/sim \
              -resultBundlePath "$RESULT_BUNDLE" \
              -only-testing:"NovelyPrivateUITests/NovelyPrivateUITests/$TEST_NAME" \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=YES \
              | tail -n 80 || TEST_EXIT=$?
            kill -INT "$REC_PID" || true
            wait "$REC_PID" || true
            sleep 2
            if [ -d "$RESULT_BUNDLE" ]; then
              xcrun xcresulttool export attachments --path "$RESULT_BUNDLE" --output-path "build/screenshots/${TEST_NAME}" || true
            fi
            return $TEST_EXIT
          }

          record_clip "test01_BookshelfAnd3DBookDemo" "01_Regal_Deko_3DBuch.mp4"
          record_clip "test02_LiveSearchAndAddBookDemo" "02_Buch_Suchen_Hinzufuegen.mp4"
          record_clip "test03_LesenLesezeitAndStatsDemo" "03_Lesen_Lesezimmer_Statistik.mp4"

          ls -lh build/videos/

      - name: Upload Unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NovelyPrivate-IPA
          path: build/NovelyPrivate.ipa
          if-no-files-found: warn

      - name: Upload Demo Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-demo-videos
          path: build/videos
          if-no-files-found: warn

      - name: Upload Simulator Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: build/screenshots
          if-no-files-found: warn
